[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "historic-sites"
version = "0.1.0"
description = "Comprehensive database of historic sites in the United States"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "anthropic>=0.40",
    "pydantic>=2.5",
    "simplekml>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",
    "folium>=0.15",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "thefuzz[speedup]>=0.22",
    "beautifulsoup4>=4.12",
    "pytesseract>=0.3",
    "pdf2image>=1.16",
    "Pillow>=10.0",
    "geopy>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
